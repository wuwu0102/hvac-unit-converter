plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.wuwu0102.hvacunitconverter'
    compileSdkVersion 34

    defaultConfig {
        applicationId 'com.wuwu0102.hvacunitconverter'
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
}
