<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>HVAC Unit Converter Web V0.28</title><link rel="stylesheet" href="./styles.css?v=20260508-production"/></head><body><main>
<section class="page active" id="home-page"><h1>HVAC 單位換算工具 Web V0.28</h1><div class="menu-grid">
<button class="menu-button" data-nav-target="temp-page">溫度換算</button><button class="menu-button" data-nav-target="airflow-page">流量換算</button><button class="menu-button" data-nav-target="pressure-page">壓力換算</button><button class="menu-button" data-nav-target="velocity-page">流速換算</button><button class="menu-button" data-nav-target="power-page">電力換算</button><button class="menu-button" data-nav-target="current-page">kW估算電流</button><button class="menu-button" data-nav-target="dc-page">機房/資料中心整合估算</button><button class="menu-button" data-nav-target="vent-page">換氣量計算</button><button class="menu-button" data-nav-target="load-page">冷負載估算</button><button class="menu-button" data-nav-target="pipe-page">水管管徑建議</button><button class="menu-button" data-nav-target="dp-page">壓差估算流量</button><button class="menu-button" data-nav-target="feedback-page">意見回饋</button></div></section>
<section class="page" id="temp-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>溫度換算</h2><div class="row"><input data-tool="temp" data-role="value" type="number"><select data-tool="temp" data-role="unit"><option>C</option><option>F</option></select></div><p data-tool="temp" data-role="result">-</p></article></section>
<section class="page" id="airflow-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>流量換算</h2><div class="row"><input data-tool="airflow" data-role="value" type="number"><select data-tool="airflow" data-role="unit"><option>CFM</option><option>CMH</option><option>m3/s</option><option>L/s</option><option>LPM</option></select></div><p data-tool="airflow" data-role="result">-</p></article></section>
<section class="page" id="pressure-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>壓力換算</h2><div class="row"><input data-tool="pressure" data-role="value" type="number"><select data-tool="pressure" data-role="unit"><option>Pa</option><option>kPa</option><option>bar</option><option>psi</option></select></div><p data-tool="pressure" data-role="result">-</p></article></section>
<section class="page" id="velocity-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>流速換算</h2><div class="row"><input data-tool="velocity" data-role="value" type="number"><select data-tool="velocity" data-role="unit"><option>m/s</option><option>ft/s</option></select></div><p data-tool="velocity" data-role="result">-</p></article></section>
<section class="page" id="power-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>電力單位換算</h2><div class="row"><input data-tool="power" data-role="value" type="number"><select data-tool="power" data-role="unit"><option>W</option><option>kW</option><option>HP</option></select></div><p data-tool="power" data-role="result">-</p></article></section>
<section class="page" id="current-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>kW估算電流</h2><div class="row"><input id="kw" type="number" placeholder="kW"><input id="volt" type="number" placeholder="V"></div><p id="current-result">-</p></article></section>
<section class="page" id="dc-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>機房/資料中心整合估算</h2><div class="row"><input id="it-load" type="number" placeholder="IT負載 kW"><input id="pue" type="number" value="1.5" placeholder="PUE"></div><p id="dc-result">-</p></article></section>
<section class="page" id="vent-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>換氣量計算</h2><div class="row"><input id="room-volume" type="number" placeholder="空間體積 m3"><input id="ach" type="number" placeholder="ACH"></div><p id="vent-result">-</p></article></section>
<section class="page" id="load-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>冷負載估算</h2><div class="row"><input id="airflow-cmh" type="number" placeholder="CMH"><input id="delta-t" type="number" placeholder="ΔT °C"></div><p id="load-result">-</p></article></section>
<section class="page" id="pipe-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>水管管徑建議</h2><input id="pipe-flow" type="number" placeholder="LPM"><p id="pipe-result">-</p></article></section>
<section class="page" id="dp-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>壓差估算流量</h2><div class="row"><input id="dp-kpa" type="number" placeholder="壓差 kPa"><input id="dp-ref" type="number" value="30" placeholder="參考壓損 kPa"></div><input id="dp-ref-flow" type="number" value="300" placeholder="參考流量 LPM"><p id="dp-result">-</p></article></section>
<section class="page" id="feedback-page"><button class="back-btn" data-nav-home>返回首頁</button><article class="card"><h2>意見回饋</h2><div class="menu-grid"><button class="menu-button" data-feedback-google>Google Form 回饋</button><button class="menu-button" data-feedback-email>Email 備援回饋</button></div></article></section>
</main><script src="./src/data/pipeSizes.js?v=20260508-production"></script><script src="./app.js?v=20260508-production" defer></script></body></html>
