name: Safe Sync Test to Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  safe-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch test repo as testrepo remote
        run: |
          git remote add testrepo https://github.com/wuwu0102/hvac-unit-converter-test.git || true
          git fetch testrepo main

      - name: Sync ONLY JS (no UI overwrite)
        run: |
          git checkout testrepo/main -- app.js || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore: sync app.js from test"
          git push
