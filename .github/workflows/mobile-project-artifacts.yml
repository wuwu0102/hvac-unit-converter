name: Build Mobile Project Artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-mobile-project-artifacts:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor packages
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/android --save

      - name: Install TypeScript
        run: npm install --save-dev typescript

      - name: Build web assets
        run: npm run build

      - name: Clean native folders in runner workspace
        run: rm -rf ios android

      - name: Add iOS project
        run: npx cap add ios || true

      - name: Add Android project
        run: npx cap add android || true

      - name: Fix iOS deployment target to 14.0
        run: |
          if [ -f ios/App/Podfile ]; then
            if grep -q "platform :ios" ios/App/Podfile; then
              sed -i '' "s/platform :ios, .*/platform :ios, '14.0'/" ios/App/Podfile || true
            else
              sed -i '' "1s/^/platform :ios, '14.0'\n/" ios/App/Podfile || true
            fi
          fi

          if [ -f ios/App/App.xcodeproj/project.pbxproj ]; then
            sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/App/App.xcodeproj/project.pbxproj || true
          fi

      - name: Copy web assets to Capacitor projects
        run: |
          npx cap copy ios || true
          npx cap copy android || true

      - name: Sync Android project only
        run: npx cap sync android || true

      - name: Create iOS project zip
        run: |
          rm -f hvac-ios-project.zip
          ditto -c -k --sequesterRsrc --keepParent ios hvac-ios-project.zip

      - name: Create Android project zip
        run: |
          rm -f hvac-android-project.zip
          ditto -c -k --sequesterRsrc --keepParent android hvac-android-project.zip

      - name: Upload iOS project artifact
        uses: actions/upload-artifact@v4
        with:
          name: hvac-ios-project
          path: hvac-ios-project.zip

      - name: Upload Android project artifact
        uses: actions/upload-artifact@v4
        with:
          name: hvac-android-project
          path: hvac-android-project.zip
