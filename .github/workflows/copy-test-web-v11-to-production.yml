name: Copy Test Web V1.1 To Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-web-v11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          repository: wuwu0102/hvac-unit-converter-test
          ref: main
          path: test-src

      - name: Sync only web production files
        shell: bash
        run: |
          set -euo pipefail

          # Recreate production tree with only protected root files kept.
          find production -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'README.md' \
            ! -name '.nojekyll' \
            -exec rm -rf {} +

          # Allowlist copy: copy only files/folders required by web production.
          # Explicitly avoid .github and workflow files.
          rsync -a --delete \
            --exclude='*' \
            --include='index.html' \
            --include='styles.css' \
            --include='app.js' \
            --include='package.json' \
            --include='package-lock.json' \
            --include='smoke-test.js' \
            --include='src/***' \
            --include='docs/***' \
            --include='scripts/***' \
            test-src/ production/

          # Defensive cleanup for forbidden paths/files.
          rm -rf \
            production/.github \
            production/android \
            production/ios \
            production/web \
            production/lib \
            production/test \
            production/legacy-web

          rm -f \
            production/analysis_options.yaml \
            production/pubspec.yaml \
            production/ExportOptions.plist

          # Defensive cleanup for any workflow yml/yaml that might slip in.
          find production -type f \( -name '*.yml' -o -name '*.yaml' \) \
            -path '*/.github/workflows/*' -delete

      - name: Validate no workflow files are synced
        shell: bash
        run: |
          set -euo pipefail

          if find production/.github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | grep -q .; then
            echo "Error: workflow files were copied into production sync output"
            exit 1
          fi

      - name: Commit synced changes
        shell: bash
        working-directory: production
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git status --porcelain | grep -qE '^.. \.github/workflows/'; then
            echo "Error: .github/workflows changes detected in sync output"
            git status --porcelain
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync test web v1.1 to production (exclude workflows)"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
