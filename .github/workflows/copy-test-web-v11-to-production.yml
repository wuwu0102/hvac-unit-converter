name: Copy Full Test Web V1.1 To Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-full-web-v11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          repository: wuwu0102/hvac-unit-converter-test
          ref: main
          path: test-src

      - name: Fully sync Web V1.1 content (exclude README/.git/GitHub Pages settings)
        shell: bash
        run: |
          set -euo pipefail

          # Remove all tracked production files except protected ones.
          find production -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'README.md' \
            ! -name '.nojekyll' \
            -exec rm -rf {} +

          # Copy all test content except protected exclusions.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='README.md' \
            --exclude='.nojekyll' \
            test-src/ production/

      - name: Validate optional full-sync targets (skip when missing)
        shell: bash
        working-directory: production
        run: |
          set -euo pipefail

          synced_paths=(
            index.html
            app.js
            styles.css
            src
            assets
            data
            feedback
            scripts
          )

          for p in "${synced_paths[@]}"; do
            if [ -e "$p" ]; then
              echo "Synced path detected: $p"
            else
              echo "Synced path missing, skipping: $p"
            fi
          done

          if [ -f app.js ] || [ -f index.html ]; then
            rg -Fq "feedback" app.js index.html || echo "feedback feature markers missing (non-blocking)"
            rg -Fq "data center" app.js index.html || true
          else
            echo "app.js/index.html not found; skip marker checks"
          fi

      - name: Commit synced changes
        shell: bash
        working-directory: production
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync full test web v1.1 to production"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
