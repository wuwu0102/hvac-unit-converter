name: Copy Test Web V1.1 To Production

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-web-v11:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout production repository
        uses: actions/checkout@v4
        with:
          path: production

      - name: Checkout test repository
        uses: actions/checkout@v4
        with:
          repository: wuwu0102/hvac-unit-converter-test
          ref: main
          path: test-src

      - name: Backup production workflows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp
          cp -a production/.github/workflows /tmp/workflows-backup

      - name: Allowlist copy web files only
        shell: bash
        run: |
          set -euo pipefail

          # Required
          cp -a test-src/index.html production/index.html
          cp -a test-src/app.js production/app.js
          cp -a test-src/styles.css production/styles.css
          rm -rf production/src
          cp -a test-src/src production/src

          # Optional (copy only when present)
          [ -f test-src/package.json ] && cp -a test-src/package.json production/package.json || true
          [ -f test-src/package-lock.json ] && cp -a test-src/package-lock.json production/package-lock.json || true
          [ -f test-src/smoke-test.js ] && cp -a test-src/smoke-test.js production/smoke-test.js || true

          if [ -d test-src/docs ]; then
            rm -rf production/docs
            cp -a test-src/docs production/docs
          fi

          if [ -d test-src/scripts ]; then
            rm -rf production/scripts
            cp -a test-src/scripts production/scripts
          fi

      - name: Restore workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production/.github/workflows
          mkdir -p production/.github
          cp -a /tmp/workflows-backup production/.github/workflows

      - name: Validate workflows unchanged
        shell: bash
        working-directory: production
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain .github/workflows)" ]; then
            echo "Error: .github/workflows changes detected in sync output"
            git status --porcelain .github/workflows
            exit 1
          fi

      - name: Commit synced changes
        shell: bash
        working-directory: production
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add index.html app.js styles.css src
            [ -f package.json ] && git add package.json || true
            [ -f package-lock.json ] && git add package-lock.json || true
            [ -f smoke-test.js ] && git add smoke-test.js || true
            [ -d docs ] && git add docs || true
            [ -d scripts ] && git add scripts || true
            git commit -m "Prevent workflow files from being touched during test Web sync"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
