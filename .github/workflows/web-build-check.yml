name: Web Build Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect project type and run build checks
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build
          else
            echo "Static project detected, skipping npm build"
            test -f index.html
          fi
