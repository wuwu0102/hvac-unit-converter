name: iOS Build Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor

      - name: Regenerate clean iOS project
        run: |
          rm -rf ios
          flutter create --platforms=ios .

      - name: Configure iOS Bundle ID and Team ID
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.hvacUnitConverter;/PRODUCT_BUNDLE_IDENTIFIER = com.wuwu0102.hvacUnitConverter;/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = 77LPMPBV88;/g' "$PBXPROJ"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS (NO CODESIGN)
        run: flutter build ios --release --no-codesign
