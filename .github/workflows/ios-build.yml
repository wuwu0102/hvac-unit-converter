name: iOS Build Only

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-15   # 🔥 避開 arm64 問題

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'   # 🔥 固定版本（關鍵）

      - name: Flutter doctor
        run: flutter doctor

      - name: Install dependencies
        run: flutter pub get

      - name: Clean project
        run: flutter clean

      - name: Build iOS (NO CODESIGN)
        run: flutter build ios --release --no-codesign

