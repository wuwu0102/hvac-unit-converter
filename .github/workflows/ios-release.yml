name: iOS Release TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Clean rebuild iOS platform
        run: |
          set -euo pipefail
          rm -rf ios
          flutter create . --platforms=ios --org com.wuwu0102 --project-name hvac_unit_converter

      - name: Configure iOS release build settings
        run: |
          set -euo pipefail
          {
            echo ""
            echo "PRODUCT_BUNDLE_IDENTIFIER = com.wuwu0102.hvacconverter"
            echo "INFOPLIST_KEY_CFBundleDisplayName = HVAC Converter"
          } >> ios/Flutter/Release.xcconfig

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Check App Store Connect secrets
        run: |
          set -euo pipefail
          [ -n "${APPSTORE_ISSUER_ID:-}" ] || { echo "Missing APPSTORE_ISSUER_ID"; exit 1; }
          [ -n "${APPSTORE_KEY_ID:-}" ] || { echo "Missing APPSTORE_KEY_ID"; exit 1; }
          [ -n "${APPSTORE_PRIVATE_KEY:-}" ] || { echo "Missing APPSTORE_PRIVATE_KEY"; exit 1; }

      - name: Create App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Validate Runner workspace
        run: |
          set -euo pipefail
          xcodebuild -list -workspace ios/Runner.xcworkspace

      - name: Build iOS IPA
        run: |
          set -euo pipefail
          flutter build ipa --release

      - name: Verify IPA output exists
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if [ ${#ipa_files[@]} -eq 0 ]; then
            echo "No IPA files found under build/ios/ipa"
            exit 1
          fi
          ls -lh build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if [ ${#ipa_files[@]} -eq 0 ]; then
            echo "No IPA files found under build/ios/ipa for upload"
            exit 1
          fi
          xcrun altool \
            --upload-app \
            --type ios \
            --file "${ipa_files[0]}" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"
