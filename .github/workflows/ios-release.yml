name: iOS Release TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Check App Store Connect secrets
        run: |
          set -euo pipefail
          [ -n "${APPSTORE_ISSUER_ID:-}" ] || { echo "Missing APPSTORE_ISSUER_ID"; exit 1; }
          [ -n "${APPSTORE_KEY_ID:-}" ] || { echo "Missing APPSTORE_KEY_ID"; exit 1; }
          [ -n "${APPSTORE_PRIVATE_KEY:-}" ] || { echo "Missing APPSTORE_PRIVATE_KEY"; exit 1; }

      - name: Create App Store Connect API key
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod repo update
          pod install

      - name: Validate Runner workspace
        run: |
          set -euo pipefail
          xcodebuild -list -workspace ios/Runner.xcworkspace

      - name: Archive iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/Runner.xcarchive \
            archive \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_STYLE=Automatic

      - name: Create ExportOptions.plist
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>destination</key>
              <string>export</string>
            </dict>
          </plist>
          PLIST

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportPath build \
            -exportOptionsPlist ios/ExportOptions.plist

      - name: Verify IPA
        run: |
          set -euo pipefail
          test -f build/Runner.ipa
          ls -lh build/Runner.ipa

      - name: Upload to TestFlight
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --type ios \
            --file build/Runner.ipa \
            --apiKey $APPSTORE_KEY_ID \
            --apiIssuer $APPSTORE_ISSUER_ID
